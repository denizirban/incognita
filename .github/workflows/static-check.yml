name: Static app quality gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify routes and inline JavaScript
        run: python3 scripts/check_static.py
      - name: Verify structural alignment numerics
        run: node scripts/test_alignment.cjs
      - name: Verify zinc coordination screening
        run: node scripts/test_zinc.cjs
      - name: Verify conservative MD preparation gate
        run: node scripts/test_md_gate.cjs
      - name: Verify Parkinson 3D atlas graph and references
        run: node scripts/test_atlas_graph.cjs
      - name: Verify protein viewer deep-link handoff
        run: node scripts/test_protein_handoff.cjs
      - name: Verify catalytic C431 spotlight safeguards
        run: node scripts/test_c431_spotlight.cjs
